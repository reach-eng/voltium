name: Flutter CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'flutter/**'
      - 'web/src/contracts/**'
      - 'web/prisma/**'
      - '.github/workflows/flutter-ci-cd.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'flutter/**'
      - 'web/src/contracts/**'
      - 'web/prisma/**'
      - '.github/workflows/flutter-ci-cd.yml'
  workflow_dispatch:
    inputs:
      api-level:
        description: 'Android API level for emulator'
        required: true
        default: '33'
        type: choice
        options:
          - '29'
          - '30'
          - '31'
          - '32'
          - '33'
          - '34'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.41.4'

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./flutter
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: flutter/.dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('flutter/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Get dependencies
        run: flutter pub get

      - name: Regenerate Flutter API client
        run: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Check for generated code drift
        run: |
          if ! git diff --exit-code -- '*.dart'; then
            echo "::error::Generated Flutter code is out of date. Run 'dart run build_runner build --delete-conflicting-outputs' and commit the changes."
            exit 1
          fi

      - name: Run Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Run design system lint
        # Ticket #32: design-system gate. Catches raw `Color(0xFF...)` in
        # non-theme files, off-grid `EdgeInsets.all(N)`, and off-grid
        # `BorderRadius.circular(N)`. Bypass with `ALLOW_DESIGN_LINT=1` only
        # in emergencies; that env var is checked inside the script.
        run: bash flutter/scripts/lint-design-system.sh

      - name: Run static palette token ratchet
        # DARK-MODE-AUDIT 2026-08-14 PR3: Catches light-only `AppColors.X`
        # references outside `lib/theme/app_theme.dart`. The migration target
        # is `AppColors.of(context).X` (brightness-aware). Allowed exceptions
        # are documented in `flutter/tool/lint_static_palette_tokens.dart`.
        # Bypass with `ALLOW_PALETTE_LINT=1` only in emergencies.
        run: |
          if [ "${ALLOW_PALETTE_LINT:-0}" = "1" ]; then
            echo "[lint_static_palette_tokens] ALLOW_PALETTE_LINT=1 — emergency bypass, skipping checks."
            exit 0
          fi
          cd flutter && dart run tool/lint_static_palette_tokens.dart

  test:
    name: Flutter Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [analyze]
    defaults:
      run:
        working-directory: ./flutter
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: flutter/.dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('flutter/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [analyze]
    defaults:
      run:
        working-directory: ./flutter
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: flutter/.dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('flutter/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voltium-debug.apk
          path: flutter/build/app/outputs/flutter-apk/app-debug.apk
          # PR-141: cap debug-APK retention at 7 days. Default is 90 days
          # which, across every push, would keep 90 × daily = ~90 debug
          # APKs (~5GB total). Debug APKs are diagnostic-only and the
          # build can be reproduced from any commit.
          retention-days: 7

  e2e-test:
    name: Flutter E2E Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [build-debug]

    strategy:
      matrix:
        api-level: [33]
        target: [google_apis]
    defaults:
      run:
        working-directory: ./flutter
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Start PostgreSQL Service
        run: |
          sudo systemctl start postgresql.service
          until pg_isready; do sleep 1; done
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres psql -c "CREATE DATABASE voltium_test;"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ./web

      - name: Setup database
        run: |
          npx prisma generate
          npx prisma migrate deploy
        working-directory: ./web
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/voltium_test'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: flutter/.dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('flutter/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Start backend dev server
        run: |
          npm run dev &
          npx wait-on http://localhost:8081 --timeout 30000
        working-directory: ./web
        env:
          NODE_ENV: development
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/voltium_test'
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}

      - name: Run Flutter integration tests
        uses: reactivecircus/android-emulator-runner@70f4dee990796918b78d040e3278474bdbd348a7 # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: ./flutter
          script: |
            adb reverse tcp:8081 tcp:8081
            bash integration_test/e2e_individual/run_phased_tests.sh emulator-5554

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-test-screenshots
          path: flutter/screenshots/
          if-no-files-found: ignore

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-test-logs
          path: flutter/test-results/
          if-no-files-found: ignore

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [build-debug, e2e-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ./flutter
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: flutter/.dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('flutter/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare Android release signing
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf "%s" "$KEYSTORE_BASE64" | base64 --decode > android/app/voltium-release.jks
          cat > android/app/key.properties <<EOF
          storeFile=voltium-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Release APK
        # PR-28 (Rider N6): --split-per-abi produces 3 per-ABI APKs (~14MB each)
        # instead of a single universal APK (~35MB). Output files:
        #   app-arm64-v8a-release.apk    — real devices
        #   app-armeabi-v7a-release.apk  — older ARMv7 devices
        #   app-x86_64-release.apk       — emulators
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols/

      - name: Upload Release APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voltium-release.apk
          path: flutter/build/app/outputs/flutter-apk/*-release.apk

      - name: Clean up keystore
        if: always()
        run: |
          # Overwrite keystore with random bytes before deletion (defense in depth)
          if [ -f android/app/voltium-release.jks ]; then
            dd if=/dev/urandom of=android/app/voltium-release.jks bs=1M count=1 2>/dev/null || true
            rm -f android/app/voltium-release.jks
          fi
          rm -f android/app/key.properties

          # Verify cleanup actually happened (defense against silent partial cleanup)
          REMAINING=""
          [ -f android/app/voltium-release.jks ] && REMAINING="$REMAINING voltium-release.jks"
          [ -f android/app/key.properties ]     && REMAINING="$REMAINING key.properties"
          if [ -n "$REMAINING" ]; then
            echo "::error:: Keystore cleanup incomplete — files still on disk:$REMAINING"
            exit 1
          fi
          echo "Keystore and key.properties cleaned up and verified gone."
