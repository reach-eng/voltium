name: Secret Rotation Check (Nightly)

on:
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-rotation:
    name: Check Secret Rotation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Check secret rotation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx src/lib/secret-rotation.ts

      - name: Notify on failure
        if: failure()
        run: |
          curl -sS -X POST "${{ secrets.ALERT_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"text":"⚠️ Secret rotation check failed — one or more secrets are stale. Check CI for details."}' || true
