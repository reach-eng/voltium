name: Secret Rotation Check (Weekly)

on:
  schedule:
    - cron: '0 6 * * 1'  # 6 AM UTC weekly on Mondays
  workflow_dispatch:

concurrency:
  group: secret-rotation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  timeout-minutes: 60
  check-rotation:
    name: Check Secret Rotation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Check secret rotation
        env:
          # TODO(read-only role): this job only reads systemSetting rows to
          # compare rotation timestamps. Provision a dedicated read-only
          # Postgres role and use its DATABASE_URL secret here instead of
          # the full application credential (least privilege).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx ../scripts/check-secret-rotation.ts

      - name: Notify on failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if ! curl -sS -X POST "$ALERT_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"text":"⚠️ Secret rotation check failed — one or more secrets are stale. Check CI for details."}'; then
            echo "::error::Failed to deliver alert webhook notification — check ALERT_WEBHOOK_URL configuration."
            exit 1
          fi
