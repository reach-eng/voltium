name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: ./web

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  timeout-minutes: 120
  # ─── Secret Scanning ─────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── SAST (Semgrep) ───────────────────────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69b48a968c21fb4b97b6e0e07d466a47e0d # v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (security-audit + owasp-top-ten)
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/typescript \
            --config p/javascript \
            --error \
            --severity ERROR \
            --severity WARNING \
            web/src

  # ─── No-Docker Check ──────────────────────────────────────────────────────────
  no-docker-check:
    name: No-Docker Enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check no Docker files or commands
        run: bash scripts/check-no-docker.sh

  # ─── Regression Gates Check ───────────────────────────────────────────────
  regression-gates-check:
    name: Regression Gates Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run CI regression-prevention gates
        run: bash scripts/check-regression-gates.sh

  # ─── Lint & TypeScript ────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier Check
        run: npm run format:check

      - name: TypeScript Check
        run: npm run typecheck

      - name: Run dark-mode token ratchet
        # DARK-MODE-AUDIT 2026-08-14 PR3: Catches `text-X-600` (and other
        # light-mode-dark weights) without a sibling `dark:text-X-300` or
        # `dark:text-X-400`. Mirrors the Flutter ratchet at
        # `flutter/tool/lint_static_palette_tokens.dart`. Bypass with
        # `ALLOW_DARK_TOKEN_LINT=1` only in emergencies.
        run: |
          if [ "${ALLOW_DARK_TOKEN_LINT:-0}" = "1" ]; then
            echo "[lint-dark-mode-tokens] ALLOW_DARK_TOKEN_LINT=1 — emergency bypass, skipping checks."
            exit 0
          fi
          node web/scripts/lint-dark-mode-tokens.js

  # ─── Prisma Validate & Migration Status ───────────────────────────────────
  prisma-check:
    name: Prisma Validate & Migration Status
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # DATABASE_URL is scoped here (moved from the workflow-level env):
    # `prisma migrate status` and check-secret-rotation.sh both query the
    # live database. No other job in this workflow consumes it.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check migration status
        run: npx prisma migrate status

      - name: Check migration safety
        run: bash ../scripts/check-migration-safety.sh

      - name: Check secret rotation & PII security
        run: bash ../scripts/check-secret-rotation.sh

  # ─── OpenAPI Staleness Check ──────────────────────────────────────────────
  openapi-check:
    name: OpenAPI Spec Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Regenerate OpenAPI spec
        run: npm run generate:openapi

      - name: Check for uncommitted OpenAPI changes
        run: |
          if ! git diff --exit-code src/contracts/openapi.json; then
            echo "::error::OpenAPI spec is stale. Run 'npm run generate:openapi' and commit the updated src/contracts/openapi.json"
            exit 1
          fi

  # ─── Build ────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: [lint-and-typecheck, prisma-check, openapi-check, no-docker-check, regression-gates-check, sast]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js app
        run: npm run build

      - name: Build worker bundle
        run: npm run worker:build

  # ─── Tests ────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voltium_test
          POSTGRES_PASSWORD: voltium_test
          POSTGRES_DB: voltium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://voltium_test:voltium_test@localhost:5432/voltium_test
      DATABASE_URL: postgresql://voltium_test:voltium_test@localhost:5432/voltium_test
      # The test schema is synced once by sync-test-schema.sh below; skip the
      # slow per-invocation `prisma db push` in vitest's global-setup. The
      # purgedAt sentinel check in web/tests/global-setup.ts then acts as the
      # loud drift gate (see web/scripts/sync-test-schema.sh).
      SKIP_PRISMA_PUSH: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Check migration status
        run: npx prisma migrate status

      # Sync the ?schema=test database (prisma db push + datetime->timestamptz
      # conversion) before any vitest run. global-setup then verifies the sync
      # via the purgedAt sentinel column and fails loudly on drift.
      - name: Sync test schema
        run: bash scripts/sync-test-schema.sh

      # TEST-STRATEGY-AUDIT T-P1-5 (2026-08-08): the no-trivial-tests
      # linter catches the placeholder pattern that hid 3 Flutter
      # golden tests. Runs before the actual test job so a CI fail
      # here is a fast, cheap signal that doesn't require spinning
      # up Postgres or running the full unit-test suite.
      - name: Lint for placeholder / trivial tests
        run: node scripts/lint-no-trivial-tests.js

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Run contract tests
        run: npm run test:contracts

      - name: Seed database
        run: npm run db:seed

      - name: Run integration tests with coverage
        run: npm run test:coverage:integration

      - name: Check API coverage gap
        run: npm run test:coverage-gap

      - name: Merge coverage & enforce 85% line coverage gate
        run: npm run test:coverage:merge
        env:
          MIN_COVERAGE: '85.0'

      - name: Upload combined coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: web/coverage-combined/lcov.info

  # ─── Workflow Coverage Gates ────────────────────────────────────────────────
  workflow-gates:
    name: Workflow Coverage Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run backend workflow gate
        run: bash scripts/check-backend-workflows.sh

      - name: Run screen workflow coverage gate
        run: bash scripts/check-screen-workflow-coverage.sh

  # ─── Deploy Staging (DISABLED — see note) ─────────────────────────────────
  # NOTE: This job previously ran on ubuntu-latest (fresh VM each run) which
  # meant PM2 had no persistent state and the deploy was a no-op. Staging
  # deploys are run manually via `./scripts/deploy-staging.sh` on the staging
  # server. To re-enable automated deploys, use a self-hosted runner with
  # PM2 state or SSH to the staging server via appleboy/ssh-action@v1.
  # deploy-staging:
  #   name: Deploy Staging
  #   runs-on: [self-hosted, staging-runner]
  #   ...

  flutter-test:
    name: Flutter Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      - run: cd flutter && flutter pub get
      - name: Run i18n localization tests
        run: cd flutter && flutter test test/core/i18n_test.dart
      - run: cd flutter && flutter test --coverage
      - name: Enforce 85% coverage
        run: |
          COVERAGE=$(lcov --summary flutter/coverage/lcov.info | grep "lines......" | cut -d ' ' -f 4 | cut -d '%' -f 1)
          echo "Current coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 85.0" | bc -l) )); then
            echo "::error::Coverage ($COVERAGE%) is below the required 85%"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-coverage
          path: flutter/coverage/lcov.info
      - name: Cleanup keystore artifacts
        if: always()
        run: rm -f flutter/android/app/key.jks flutter/android/key.properties
