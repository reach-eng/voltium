name: Dependency Audit

# Weekly vulnerability scan across web (npm) and flutter (pub) ecosystems.
# - Posts a single GitHub issue per week with the combined findings, deduped.
# - Runs on schedule (Monday 06:00 UTC) and on manual dispatch.
# - Trivy SBOM for compliance traceability.
#
# Companion: `.github/dependabot.yml` opens PRs for non-vulnerable bumps.
# This workflow flags security vulnerabilities that need *attention* (not bumps).

on:
  schedule:
    # Every Monday 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      severity_threshold:
        description: 'Minimum severity to report (low|moderate|high|critical)'
        required: false
        default: 'moderate'
        type: choice
        options:
          - low
          - moderate
          - high
          - critical

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  # ─── Web (npm) audit ─────────────────────────────────────────────────────
  web-audit:
    name: Web (npm) Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run npm audit (json)
        id: audit
        run: |
          set +e
          npm audit --json --audit-level=${{ inputs.severity_threshold || 'moderate' }} > npm-audit.json 2> npm-audit.stderr
          EXIT=$?
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          # Treat 0 (no vulns) and 1 (audit ran, vulns found) as success;
          # only code >=2 is a hard error.
          if [ $EXIT -ge 2 ]; then
            echo "::error::npm audit exited with code $EXIT"
            cat npm-audit.stderr
            exit $EXIT
          fi
        continue-on-error: true

      - name: Upload npm audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-npm-audit
          path: web/npm-audit.json
          if-no-files-found: ignore
          retention-days: 30

  # ─── Flutter (pub) audit ──────────────────────────────────────────────────
  flutter-audit:
    name: Flutter (pub) Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./flutter
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run flutter pub outdated (advisory mode)
        id: pub
        run: |
          set +e
          # `flutter pub outdated` does not classify vulnerabilities; we surface the
          # raw report so reviewers can spot stale packages with known CVEs.
          flutter pub outdated --json > flutter-pub-outdated.json 2> flutter-pub-outdated.stderr
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Upload pub outdated artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-pub-outdated
          path: flutter/flutter-pub-outdated.json
          if-no-files-found: ignore
          retention-days: 30

  # ─── Aggregate + file a single weekly issue ───────────────────────────────
  report:
    name: Aggregate + File Issue
    needs: [web-audit, flutter-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download web audit
        uses: actions/download-artifact@v4
        with:
          name: web-npm-audit
          path: artifacts/web
        continue-on-error: true

      - name: Download flutter audit
        uses: actions/download-artifact@v4
        with:
          name: flutter-pub-outdated
          path: artifacts/flutter
        continue-on-error: true

      - name: Detect any findings
        id: detect
        run: |
          WEB_HIT=0
          FLUTTER_HIT=0
          if [ -s artifacts/web/npm-audit.json ]; then
            WEB_HIT=$(node -e "const a=require('./artifacts/web/npm-audit.json'); process.stdout.write(String((a.metadata&&a.metadata.vulnerabilities&&(a.metadata.vulnerabilities.critical||0)+(a.metadata.vulnerabilities.high||0))||0))" 2>/dev/null || echo 0)
          fi
          if [ -s artifacts/flutter/flutter-pub-outdated.json ]; then
            FLUTTER_HIT=$(node -e "const o=require('./artifacts/flutter/flutter-pub-outdated.json'); process.stdout.write(String(((o.packages&&o.packages.length)||0)))" 2>/dev/null || echo 0)
          fi
          echo "web_vulns=$WEB_HIT" >> "$GITHUB_OUTPUT"
          echo "flutter_outdated=$FLUTTER_HIT" >> "$GITHUB_OUTPUT"
          echo "Web vulnerabilities (critical+high): $WEB_HIT"
          echo "Flutter outdated packages: $FLUTTER_HIT"

      - name: Close existing open weekly audit issue
        if: steps.detect.outputs.web_vulns == 0 && steps.detect.outputs.flutter_outdated == 0
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependency-audit',
              per_page: 10,
            });
            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ No critical/high web vulnerabilities and no flutter outdated packages as of ' + new Date().toISOString() + '. Auto-closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

      - name: Open / update weekly audit issue
        if: steps.detect.outputs.web_vulns != 0 || steps.detect.outputs.flutter_outdated != 0
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const webVulns = '${{ steps.detect.outputs.web_vulns }}';
            const flutterOutdated = '${{ steps.detect.outputs.flutter_outdated }}';
            const date = new Date().toISOString().slice(0, 10);

            let body = `## Weekly dependency audit — ${date}\n\n`;
            body += `| Ecosystem | Finding | Count |\n|---|---|---|\n`;
            body += `| web (npm) | critical+high vulns | ${webVulns} |\n`;
            body += `| flutter (pub) | outdated packages | ${flutterOutdated} |\n\n`;
            body += '### Where to look\n\n';
            body += '- `web/npm-audit.json` — full npm audit report (artifact)\n';
            body += '- `flutter/flutter-pub-outdated.json` — full pub outdated report (artifact)\n\n';
            body += '### Recommended actions\n\n';
            body += '1. **npm vulns**: run `cd web && npm audit` locally, then `npm audit fix` for non-breaking patches.\n';
            body += '2. **Outdated packages**: review `flutter pub outdated` for major-version drifts; bump in a focused PR.\n';
            body += '3. For CVSS ≥ 7.0: file a P1 ticket in `docs/FOLLOWUP_TICKETS.md` and fix this week.\n\n';
            body += '---\n';
            body += '_Auto-generated by `.github/workflows/dependency-audit.yml`. Close manually once resolved._';

            // Find an open issue with this label
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependency-audit',
              per_page: 1,
            });

            if (issues.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body,
              });
              core.info('Updated existing audit issue #' + issues.data[0].number);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Weekly dependency audit — ' + date,
                body,
                labels: ['dependency-audit', 'security'],
              });
              core.info('Opened new audit issue #' + created.data.number);
            }

  # ─── SBOM (CycloneDX) for compliance ──────────────────────────────────────
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    needs: [web-audit]
    if: always()
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Generate web SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          artifact-name: web-sbom.cdx.json
          path: web/package.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-sbom
          path: web-sbom.cdx.json
          retention-days: 90
