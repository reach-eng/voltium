name: Mutation Testing (Manual / Deprecated)

# DEPRECATED: the scheduled cron was removed 2026-08-01 per
# docs/COST_RECOMMENDATIONS_2026-08-01.md — this workflow now only runs
# on manual workflow_dispatch.
on:
  workflow_dispatch:

# R10 polish #13 (Infra 4.17) — concurrency group so re-runs don't overlap.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  timeout-minutes: 120
  mutation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Stryker Mutation Tests
        run: npx stryker run
        env:
          DATABASE_OFFLINE: 'true'

      - name: Upload Stryker Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stryker-report
          path: web/reports/mutation/
          retention-days: 7

      # R10 polish #13 (Infra 4.13) — Slack notification on failure so the
      # team is paged when mutation score drops below threshold.
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"⚠️ Mutation Test failed. Check logs: ${RUN_URL}\"}" \
              "$SLACK_WEBHOOK_URL"
          else
            echo "SLACK_WEBHOOK_URL not configured. Notification skipped."
          fi
