name: Weekly Mutation Testing

# Deprecated scheduled cron 2026-08-01 per docs/COST_RECOMMENDATIONS_2026-08-01.md
# Kept for manual dispatch execution
on:
  workflow_dispatch:

# R10 polish #13 (Infra 4.17) — concurrency group so re-runs don't overlap.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Stryker Mutation Tests
        run: npx stryker run
        env:
          DATABASE_OFFLINE: 'true'

      - name: Upload Stryker Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: web/reports/mutation/
          retention-days: 7

      # R10 polish #13 (Infra 4.13) — Slack notification on failure so the
      # team is paged when mutation score drops below threshold.
      - name: Notify Slack on failure
        if: failure()
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"⚠️ Weekly Mutation Test failed. Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "${{ secrets.SLACK_WEBHOOK_URL }}"
          else
            echo "SLACK_WEBHOOK_URL not configured. Notification skipped."
          fi
