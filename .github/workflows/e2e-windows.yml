name: Windows E2E Tests (Playwright & Flutter)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.4'
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/voltium_test'
  # NOTE: JWT_SECRET is intentionally NOT set workflow-wide — it is scoped
  # to the individual steps that consume it below.

jobs:
  timeout-minutes: 120
  playwright-e2e:
    name: Playwright E2E Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # R10 polish #15 (Infra 4.8) — generate a per-run random postgres
      # password instead of hardcoding 'postgres' so leaked runner
      # credentials can't be replayed across runs.
      - name: Start PostgreSQL Service
        shell: pwsh
        run: |
          $service = Get-Service -Name postgresql* -ErrorAction SilentlyContinue
          if ($service) {
              Start-Service $service.Name
              Start-Sleep -Seconds 5
              $pgBin = Get-ChildItem "C:\Program Files\PostgreSQL\*\bin" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($pgBin) {
                  $env:PATH += ";$($pgBin.FullName)"
              }
              $pgPassword = -join ((65..90) + (97..122) + (48..57) | Get-Random -Count 24 | ForEach-Object { [char]$_ })
              $env:PGPASSWORD = $pgPassword
              # PR-140: removed -ErrorAction SilentlyContinue from the ALTER USER
              # so a password-set failure (e.g. wrong pg_hba.conf, missing
              # superuser) fails the job loudly. Previously the step could
              # silently leave the DB with the default password while CI
              # reported green.
              psql -U postgres -c "ALTER USER postgres PASSWORD '$pgPassword';"
              psql -U postgres -c "CREATE DATABASE voltium_test;" -ErrorAction SilentlyContinue
              # Re-export the connection string with the random password
              "DATABASE_URL=postgresql://postgres:$pgPassword@localhost:5432/voltium_test" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ./web

      - name: Setup Prisma Database
        run: |
          npx prisma generate
          npx prisma migrate deploy
        working-directory: ./web

      - name: Install Playwright Browsers
        run: npx playwright install
        working-directory: ./web

      - name: Run Playwright Tests
        run: npx playwright test
        working-directory: ./web
        env:
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  flutter-e2e:
    name: Flutter Android E2E Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Start PostgreSQL Service (No Docker)
        shell: pwsh
        run: |
          $service = Get-Service -Name postgresql* -ErrorAction SilentlyContinue
          if (-not $service) {
            Write-Error "No native PostgreSQL service found on runner. DB-backed Flutter E2E cannot run."
            exit 1
          }
          Start-Service $service.Name
          Start-Sleep -Seconds 5
          $pgBin = Get-ChildItem "C:\Program Files\PostgreSQL\*\bin" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($pgBin) { $env:PATH += ";$($pgBin.FullName)" }
          # R10 polish #15 (Infra 4.8) — random password per run.
          $pgPassword = -join ((65..90) + (97..122) + (48..57) | Get-Random -Count 24 | ForEach-Object { [char]$_ })
          $env:PGPASSWORD = $pgPassword
          # PR-140: no -ErrorAction SilentlyContinue on ALTER USER — a
          # password-set failure must fail the job loudly (same as the
          # playwright-e2e job above).
          psql -U postgres -c "ALTER USER postgres PASSWORD '$pgPassword';"
          psql -U postgres -c "CREATE DATABASE voltium_test;" -ErrorAction SilentlyContinue
          "DATABASE_URL=postgresql://postgres:$pgPassword@localhost:5432/voltium_test" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install backend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ./web

      - name: Setup database
        run: |
          npx prisma generate
          npx prisma migrate deploy
        working-directory: ./web
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get
        working-directory: ./flutter

      - name: Start backend dev server
        run: |
          npm run dev &
          npx wait-on http://localhost:8081 --timeout 30000
        working-directory: ./web
        env:
          NODE_ENV: development
          # Scoped from the former workflow-level JWT_SECRET — only this
          # step (the dev server) consumes it in this job.
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}

      - name: Run E2E on Windows Android Emulator
        uses: reactivecircus/android-emulator-runner@70f4dee990796918b78d040e3278474bdbd348a7 # v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: ./flutter
          script: |
            adb reverse tcp:8081 tcp:8081
            flutter test integration_test/app_test.dart --dart-define=API_URL=http://localhost:8081 --timeout=none
