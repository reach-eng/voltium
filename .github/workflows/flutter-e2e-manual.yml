name: Flutter E2E Tests (Manual)

on:
  workflow_dispatch:
    inputs:
      api-level:
        description: 'Android API level for emulator'
        required: true
        default: '33'
        type: choice
        options:
          - '29'
          - '30'
          - '31'
          - '32'
          - '33'
          - '34'
      test-file:
        description: 'Test file to run'
        required: true
        default: 'integration_test/app_test.dart'
        type: choice
        options:
          - 'integration_test/app_test.dart'
          - 'integration_test/onboarding_flow_test.dart'
          - 'integration_test/diagnostic_test.dart'

permissions:
  contents: read

concurrency:
  group: flutter-e2e-manual-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.4'
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/voltium_test'
  JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}

jobs:
  timeout-minutes: 120
  e2e:
    name: Run Flutter E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Start PostgreSQL Service
        run: |
          sudo systemctl start postgresql.service
          until pg_isready; do sleep 1; done
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres psql -c "CREATE DATABASE voltium_test;"

      # ─── Setup Node.js backend ───────────────────────────────────────────
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install backend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ./web

      - name: Setup database
        run: |
          npx prisma generate
          npx prisma migrate deploy
        working-directory: ./web
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      # ─── Setup Flutter ───────────────────────────────────────────────────
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: flutter/.dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('flutter/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Get Flutter dependencies
        run: flutter pub get
        working-directory: ./flutter

      # ─── Start dev server ────────────────────────────────────────────────
      - name: Start backend dev server
        run: |
          npm run dev &
          npx wait-on http://localhost:8081 --timeout 30000
        working-directory: ./web
        env:
          NODE_ENV: development

      # ─── Run E2E tests on Android emulator ───────────────────────────────
      - name: Run Flutter integration tests
        uses: reactivecircus/android-emulator-runner@70f4dee990796918b78d040e3278474bdbd348a7 # v2
        # NOTE: `api-level` cannot be env-indirected — it is an action input
        # (`with:`), not a shell context, so `${API_LEVEL}` would be passed
        # literally. Injection risk is nil: the workflow_dispatch input is a
        # `choice` restricted to '29'–'34'.
        with:
          api-level: ${{ github.event.inputs.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: ./flutter
          env:
            TEST_FILE: ${{ github.event.inputs.test-file }}
          script: |
            adb reverse tcp:8081 tcp:8081
            flutter test "$TEST_FILE" \
              --dart-define=API_URL=http://localhost:8081 \
              --timeout=none

      # ─── Upload artifacts ────────────────────────────────────────────────
      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-test-screenshots
          path: flutter/screenshots/
          if-no-files-found: ignore

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-test-logs
          path: flutter/test-results/
          if-no-files-found: ignore
