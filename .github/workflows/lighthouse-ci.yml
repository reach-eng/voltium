name: Lighthouse CI

on:
  pull_request:
    branches: [main, develop]

# R10 polish #13 (Infra 4.17) — concurrency group so we don't run multiple
# Lighthouse audits on rapid pushes to the same branch.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  timeout-minutes: 60
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./web

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js app
        run: npm run build

      # R10 polish #13 (Infra 4.12) — lighthouserc.json now provides the
      # collect / assert / upload config that lhci autorun consumes.
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.13.0
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
