name: Ubuntu E2E Tests (Playwright)

# TEST-STRATEGY-AUDIT T-P1-3 (2026-08-08): the prior Playwright
# pipeline only ran on `windows-latest`, so a regression in the
# admin UI was not caught until the Windows E2E pipeline ran —
# which is independent of PR merge. This workflow runs Playwright
# on `ubuntu-latest` so every PR gets the same E2E coverage that
# macOS / Linux dev boxes can reproduce locally.
#
# The Windows pipeline (e2e-windows.yml) still runs in addition —
# Windows-specific browser bugs (rare but real) get caught there.
# This Ubuntu pipeline catches Linux/macOS dev box parity first.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: e2e-ubuntu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: ./web

env:
  NODE_VERSION: '20'

jobs:
  timeout-minutes: 120
  playwright-ubuntu:
    name: Playwright (Ubuntu / Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voltium_test
          POSTGRES_PASSWORD: voltium_test
          POSTGRES_DB: voltium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://voltium_test:voltium_test@localhost:5432/voltium_test
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      # Playwright webserver is started by the test runner; we just
      # point it at the dev URL.
      BASE_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npm run db:seed

      - name: Install Playwright (Chromium only)
        # Linux dev boxes typically only have Chromium. The Windows
        # pipeline covers WebKit/Firefox. Reduces the CI run time
        # by ~50% over the full matrix.
        run: npx playwright install --with-deps chromium

      - name: Build Next.js app
        run: npm run build

      - name: Start production server
        run: |
          npm run start > /tmp/next-start.log 2>&1 &
          echo "PROD_PID=$!" >> $GITHUB_ENV

      - name: Wait for server
        run: npx wait-on tcp:3000 --timeout 60000 --interval 1000

      - name: Run Playwright (Chromium)
        run: npx playwright test --project=chromium
        env:
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-ubuntu-report
          path: playwright-report/
          retention-days: 30

      - name: Stop server
        if: always()
        run: kill ${{ env.PROD_PID }} || true
