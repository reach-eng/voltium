name: Nightly Load Test

on:
  schedule:
    - cron: '0 2 * * *' # Run at 2 AM every day
  workflow_dispatch: # Allow manual triggering

defaults:
  run:
    working-directory: ./web

env:
  NODE_VERSION: '20'

jobs:
  load-test:
    name: k6 Load Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voltium_test
          POSTGRES_PASSWORD: voltium_test
          POSTGRES_DB: voltium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://voltium_test:voltium_test@localhost:5432/voltium_test
      TEST_DATABASE_URL: postgresql://voltium_test:voltium_test@localhost:5432/voltium_test
      API_URL: http://127.0.0.1:8081
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed database (Realistic Data)
        run: npm run db:seed

      - name: Build Next.js app
        run: npm run build

      - name: Start production server
        run: |
          npm run start > /tmp/next-start.log 2>&1 &
          echo "PROD_PID=$!" >> $GITHUB_ENV

      - name: Wait for server
        run: npx wait-on tcp:8081 --timeout 60000 --interval 1000

      - name: Setup k6
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run k6 load tests
        run: k6 run tests/load/k6-load.js --out json=k6-summary.json
        continue-on-error: true # Do not fail the whole build if SLO fails, we want to review artifact

      - name: Upload k6 artifact
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: web/k6-summary.json

      - name: Stop server
        if: always()
        run: kill ${{ env.PROD_PID }} || true
