name: Weekly Load Test

on:
  schedule:
    - cron: '0 4 * * 0' # Sundays at 4:00 AM (after mutation tests)
  workflow_dispatch: # Allow manual triggering

# R10 polish #13 (Infra 4.17) — concurrency group so re-runs don't overlap.
concurrency:
  group: load-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: ./web

env:
  NODE_VERSION: '20'

jobs:
  timeout-minutes: 120
  load-test:
    name: k6 Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voltium_test
          POSTGRES_PASSWORD: voltium_test
          POSTGRES_DB: voltium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://voltium_test:voltium_test@localhost:5432/voltium_test
      TEST_DATABASE_URL: postgresql://voltium_test:voltium_test@localhost:5432/voltium_test
      API_URL: http://127.0.0.1:8081
    
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed database (Realistic Data)
        run: npm run db:seed

      - name: Build Next.js app
        run: npm run build

      - name: Start production server
        run: |
          npm run start > /tmp/next-start.log 2>&1 &
          echo "PROD_PID=$!" >> $GITHUB_ENV

      - name: Wait for server
        run: npx wait-on tcp:8081 --timeout 60000 --interval 1000

      - name: Setup k6 (pinned release)
        # Replaces the deprecated `apt-key adv --keyserver` flow (apt-key is
        # removed in Ubuntu 22.04+ and the keyserver hop was an unverified
        # supply-chain path). Downloads the pinned k6 release tarball and
        # verifies it against the release's own checksums file.
        # TODO(pin): hardcode the expected SHA256 digest below (instead of
        # trusting the release-time checksums.txt) once the digest for
        # K6_VERSION has been independently verified.
        env:
          K6_VERSION: '0.49.0'
        run: |
          curl -fsSL -o /tmp/k6.tar.gz "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz"
          curl -fsSL -o /tmp/k6-checksums.txt "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-checksums.txt"
          grep "k6-v${K6_VERSION}-linux-amd64.tar.gz" /tmp/k6-checksums.txt | sha256sum --check --status
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo mv "/tmp/k6-v${K6_VERSION}-linux-amd64/k6" /usr/local/bin/k6
          k6 version

      - name: Run k6 load tests
        id: k6
        # Capture the real exit code so the Slack summary can report SLO
        # breaches explicitly instead of only job.status.
        run: |
          set +e
          k6 run tests/load/k6-load.js --out json=k6-summary.json
          K6_EXIT=$?
          echo "exit_code=$K6_EXIT" >> "$GITHUB_OUTPUT"
          exit $K6_EXIT
        continue-on-error: true # Do not fail the whole build if SLO fails, we want to review artifact

      - name: Upload k6 artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: k6-summary
          path: web/k6-summary.json

      - name: Stop server
        if: always()
        run: kill ${{ env.PROD_PID }} || true

      # R10 polish #13 (Infra 4.14) — k6 already runs with
      # `continue-on-error: true` so the job always uploads the artifact;
      # we explicitly post a Slack summary so the team sees SLO drift.
      - name: Notify Slack with k6 summary
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          K6_EXIT_CODE: ${{ steps.k6.outputs.exit_code }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            STATUS="${{ job.status }}"
            curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"📊 Weekly Load Test: ${STATUS}. k6 exit code: ${K6_EXIT_CODE}. Artifact: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$SLACK_WEBHOOK_URL"
          else
            echo "SLACK_WEBHOOK_URL not configured. Notification skipped."
          fi
