arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
# LANGUAGE-AUDIT (2026-08-16) #11: include every locale the app
# actually ships with. The `flutter gen-l10n` runner uses this list
